<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de Asesores</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#0B0A14;--s1:#13121E;--s2:#1A1830;--s3:#26224A;--line:#2A2650;--tx:#F2F1FA;--mu:#8C88A8;
--vio:#8B6CF0;--vio2:#B7A4FF;--grad:linear-gradient(135deg,#7C5CF0,#4F7BF0);--amb:#F5B63A;--ok:#4ADE80;--bad:#F87171;--blue:#5CA4FF;
--tek:#FF7A3D;--inf:#4ADE80;--meg:#5CA4FF}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 420px at 88% -8%,rgba(124,92,240,.20),transparent 62%),radial-gradient(700px 400px at -5% 40%,rgba(59,130,246,.10),transparent 60%),var(--bg);color:var(--tx);font:15px/1.5 'IBM Plex Sans','Segoe UI',system-ui,sans-serif;min-height:100vh}
h1{margin:0;font-size:30px;letter-spacing:-.02em;line-height:1.2}
.mu{color:var(--mu);font-size:14px}
.bar{height:4px;background:linear-gradient(90deg,#8B6CF0,#B7A4FF)}
.app{max-width:1240px;margin:0 auto;padding:20px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.sb{flex:0 0 240px;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:16px}
.br{display:flex;align-items:center;gap:12px;padding:2px 8px 18px;font-weight:600;font-size:16px}
.mk{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#8B6CF0,#B7A4FF);flex:none}
.nv{display:flex;align-items:center;min-height:46px;width:100%;padding:8px 12px;color:var(--mu);border-radius:10px;cursor:pointer;background:none;border:0;font:inherit;text-align:left}
.nv.on{background:#1C1A33;color:var(--tx);font-weight:600;box-shadow:inset 3px 0 0 var(--vio)}
.me{margin-top:14px;padding:14px 8px 0;border-top:1px solid var(--line);font-size:13px}
.me b{display:block;font-size:14px}
.mn{flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px}
.cd{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px}
.g{display:flex;flex-wrap:wrap;gap:14px}
.f{flex:1 1 220px;display:flex;flex-direction:column;gap:6px}
.f.full{flex:1 1 100%}
.f label{font-size:14px;font-weight:600}
input,select,textarea{width:100%;min-height:46px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit}
textarea{padding:10px 12px;min-height:150px;resize:vertical}
input[readonly]{background:#100F1C;color:var(--mu)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--vio);outline-offset:1px}
.ch{flex:1 1 140px;min-height:48px;display:flex;align-items:center;justify-content:center;gap:10px;background:#1C1A33;color:var(--tx);border:1px solid var(--line);border-radius:12px;font:inherit;font-weight:500;cursor:pointer}
.ch::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--d,var(--vio))}
.ch.on{background:var(--s3);border:2px solid var(--d,var(--vio));font-weight:600}
.prim{min-height:46px;background:var(--grad);color:#fff;border:0;border-radius:10px;padding:0 22px;font:inherit;font-weight:700;cursor:pointer}
.prim:disabled{opacity:.5;cursor:default}
.amb{background:var(--amb);color:#1A1204}
.bt{min-height:42px;background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:0 16px;font:inherit;font-weight:500;cursor:pointer}
.bt.sm,.prim.sm{min-height:36px;padding:0 12px;font-size:13px}
.ft{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding-top:16px;border-top:1px solid var(--line)}
.tt small{display:block;color:var(--mu);font-size:13px}.tt b{font-size:26px;color:var(--ok)}
.al{padding:12px 16px;border-radius:10px;font-size:14px;font-weight:500}
.al.w{background:rgba(245,182,58,.16);border:1px solid var(--amb);color:var(--amb)}
.al.o{background:rgba(74,222,128,.14);border:1px solid var(--ok);color:var(--ok)}
.al.i{background:rgba(92,164,255,.16);border:1px solid var(--blue);color:#9CC6FF}
.al.e{background:rgba(248,113,113,.14);border:1px solid var(--bad);color:var(--bad)}
.stats{display:flex;flex-wrap:wrap;gap:14px}
.sc{flex:1 1 140px;background:#15132A;border:1px solid var(--line);border-top:4px solid var(--t);border-radius:16px;padding:16px 18px}
.sc small{color:var(--mu)}.sc b{display:block;font-size:34px;line-height:1.1}
.pill{display:inline-block;border-radius:999px;padding:2px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-t{background:rgba(255,122,61,.26);color:#FF9A6E}.p-i{background:rgba(74,222,128,.28);color:var(--ok)}.p-m{background:rgba(92,164,255,.28);color:#9CC6FF}
.p-w{background:rgba(245,182,58,.24);color:var(--amb)}.p-o{background:rgba(74,222,128,.28);color:var(--ok)}.p-v{background:rgba(139,108,240,.28);color:var(--vio2)}.p-n{background:rgba(255,255,255,.1)}.p-b{background:rgba(92,164,255,.28);color:#9CC6FF}.p-r{background:rgba(248,113,113,.22);color:var(--bad)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 0;border-top:1px solid var(--line)}
.item{background:#15132A;border:1px solid var(--line);border-left:4px solid var(--vio);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.rt{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.id{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--mu)}
.nm{font-size:17px;font-weight:700;text-transform:uppercase}
.ln{font-size:14px;color:var(--mu);line-height:1.7}.ln i{font-style:normal;color:var(--tx)}
.bs{display:flex;flex-wrap:wrap;gap:10px;padding-top:6px}
.sec{display:flex;align-items:center;gap:14px;font-size:20px;font-weight:700}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.fl{display:flex;flex-wrap:wrap;gap:8px}
.cp{min-height:38px;padding:0 15px;background:#1C1A33;color:var(--tx);border:1px solid var(--line);border-radius:999px;font:inherit;font-weight:500;cursor:pointer}
.cp.on{background:var(--grad);border-color:var(--vio);font-weight:700}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lc{width:100%;max-width:420px;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:30px;display:flex;flex-direction:column;gap:18px}
.shot{max-width:100%;max-height:260px;border-radius:10px;border:1px solid var(--line)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid var(--vio);padding:12px 20px;border-radius:12px;z-index:9;max-width:90vw}
.hide{display:none!important}
@media(max-width:820px){.sb{position:static;flex:1 1 100%;flex-direction:row;flex-wrap:wrap;padding:10px}.br{padding:4px 8px}.me{margin:0 0 0 auto;border:0;padding:0 6px}.nv{width:auto;min-height:40px}h1{font-size:25px}.app{padding:12px;gap:14px}}
</style>
</head>
<body>
<div class="bar"></div>
<div id="root"></div>
<div id="toast" class="toast hide"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script>
(function(){
"use strict";
var VERSION='v5 · 27-oct';
function errBar(t){try{var b=document.getElementById('errbar');if(!b){b=document.createElement('div');b.id='errbar';b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99;background:#F87171;color:#1A0A0A;font:13px/1.4 sans-serif;padding:8px 12px;word-break:break-word';document.body.appendChild(b);}b.textContent='Error del panel ('+VERSION+'): '+t;}catch(x){}}
window.addEventListener('error',function(e){errBar((e.message||'desconocido')+(e.lineno?' [línea '+e.lineno+']':''));});
window.addEventListener('unhandledrejection',function(e){errBar(String((e.reason&&e.reason.message)||e.reason||'promesa rechazada'));});
/* ====== CONFIG (misma de tu Panel Comercial CRG; el apiKey no es secreto, la seguridad son las reglas de Firestore) ====== */
var FB_CONFIG={apiKey:"AIzaSyDEXEF0mRg3_nF6cZJLSNhtxMRI6qLvVKs",authDomain:"panel-comercial-crg.firebaseapp.com",projectId:"panel-comercial-crg",storageBucket:"panel-comercial-crg.firebasestorage.app",messagingSenderId:"519604238226",appId:"1:519604238226:web:0fdd9e15a3d5b943e9334b"};
var ADMIN_EMAIL='nefertigonza@gmail.com';
var BRANDS={tekio:{n:'Tekio',pill:'p-t',color:'#FF7A3D'},infot:{n:'InfoT',pill:'p-i',color:'#4ADE80'},megalaptop:{n:'MegaLaptop',pill:'p-m',color:'#5CA4FF'}};
var CANALES=['Tienda','WhatsApp','Instagram','Facebook','Referido','Leads','Otro'];
var ROLES={asesor:'Asesor',tecnico:'Técnico'};
var NAV={
  asesor:[['ventas','Mis ventas'],['casos','Garantías']],
  tecnico:[['tcasos','Casos']],
  admin:[['resumen','Resumen'],['venta','Registrar venta'],['personas','Personas'],['importar','Importar'],['repetidas','Ventas repetidas']]
};

function fallo(t){var r=document.getElementById('root');if(r)r.innerHTML='<div class="login"><div class="lc"><h1>Panel de Asesores</h1><div class="al w">'+t+'</div><button class="prim" onclick="location.reload()">Recargar</button></div></div>';}
if(!window.firebase){fallo('No se pudo cargar el panel (conexión lenta o bloqueada). Revisa tu internet y recarga.');return;}
firebase.initializeApp(FB_CONFIG);
var auth=firebase.auth(), db=firebase.firestore();
try{db.settings({experimentalForceLongPolling:true,merge:true});}catch(e){}
setTimeout(function(){if(!S.ready)fallo('Está tardando más de lo normal en conectar. Revisa tu internet y recarga.');},12000);

/* ====== utilidades ====== */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){return '$'+(Number(n)||0).toFixed(2);}
function num(v){return Number(String(v).replace(',','.'))||0;}
function hoy(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function fdate(iso){if(!iso)return '—';var p=String(iso).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0].slice(2):iso;}
function toast(m){var t=$('toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.add('hide');},3200);}
function brandPill(b){var x=BRANDS[b]||{n:b,pill:'p-n'};return '<span class="pill '+x.pill+'">'+esc(x.n)+'</span>';}
function ts(){return firebase.firestore.FieldValue.serverTimestamp();}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();}
function errMsg(e){var c=e&&e.code||'';
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found'||c==='auth/invalid-login-credentials')return 'Correo o clave incorrectos.';
  if(c==='auth/too-many-requests')return 'Demasiados intentos. Espera unos minutos.';
  if(c==='auth/email-already-in-use')return 'Ese correo ya tiene una cuenta.';
  if(c==='auth/weak-password')return 'La clave debe tener al menos 6 caracteres.';
  if(c==='auth/invalid-email')return 'El correo no es válido.';
  if(c==='permission-denied')return 'No tienes permiso para esa acción.';
  return (e&&e.message)||'Ocurrió un error.';}

/* ====== estado ====== */
var A=window.A={};
var S={user:null,perfil:null,role:null,view:null,data:{},unsubs:{},cache:{},msg:null,ready:false,authErr:''};
var _rt=null;
function softRender(){
  clearTimeout(_rt);
  _rt=setTimeout(function(){
    var a=document.activeElement,r=$('root');
    if(S.down){S.pend=true;return;}
    if(a&&r&&r.contains(a)&&/^(SELECT|INPUT|TEXTAREA)$/.test(a.tagName)&&a.type!=='file'&&a.id){S.pend=true;return;}
    S.pend=false;render();
  },150);
}
document.addEventListener('focusout',function(){if(S.pend){setTimeout(softRender,300);}});
document.addEventListener('pointerdown',function(){S.down=true;setTimeout(function(){S.down=false;},3000);},true);
['pointerup','pointercancel'].forEach(function(t){document.addEventListener(t,function(){setTimeout(function(){S.down=false;if(S.pend)softRender();},400);},true);});
function sub(name,query,cb){if(S.unsubs[name])S.unsubs[name]();S.unsubs[name]=query.onSnapshot(function(snap){S.data[name]=snap.docs.map(function(d){var o=d.data();o.id=d.id;return o;});cb&&cb();softRender();},function(e){S.data[name]=[];S.msg={c:'e',t:'No se pudo leer '+name+': '+errMsg(e)};softRender();});}
function unsubAll(){Object.keys(S.unsubs).forEach(function(k){S.unsubs[k]();});S.unsubs={};S.data={};}
function marcas(){return S.role==='admin'?Object.keys(BRANDS):((S.perfil&&S.perfil.marcas)||[]);}
function nombre(){return S.role==='admin'?'Supervisora':(S.perfil&&S.perfil.nombre)||'';}

/* sucursales activas de una marca, leídas del CRG (colección store, solo lectura) */
function sucursales(marca){
  if(S.cache['suc_'+marca])return Promise.resolve(S.cache['suc_'+marca]);
  return db.doc('store/crg_sucursales_'+marca).get().then(function(s){
    var v=(s.exists&&s.data().value)||[];var out=v.filter(function(x){return x.activo!==false;}).map(function(x){return x.nombre;});
    S.cache['suc_'+marca]=out;return out;}).catch(function(){return [];});
}
function ventasCRG(marca){
  if(S.cache['v_'+marca])return Promise.resolve(S.cache['v_'+marca]);
  return db.doc('store/crg_ventas_'+marca).get().then(function(s){var v=(s.exists&&s.data().value)||[];S.cache['v_'+marca]=v;return v;}).catch(function(){return [];});
}

/* ====== login ====== */
auth.onAuthStateChanged(function(u){
  unsubAll();S.user=u;S.perfil=null;S.role=null;S.view=null;S.msg=null;
  if(!u){S.ready=true;render();return;}
  if(u.email&&u.email.toLowerCase()===ADMIN_EMAIL){S.role='admin';S.ready=true;go('resumen');return;}
  db.doc('usuarios/'+u.uid).get().then(function(s){
    S.ready=true;
    if(!s.exists){S.authErr='Tu cuenta todavía no tiene perfil. Avísale a tu supervisora.';render();return;}
    S.perfil=s.data();
    if(S.perfil.activo!==true){S.authErr='Tu usuario está desactivado. Habla con tu supervisora.';render();return;}
    S.role=S.perfil.rol;S.authErr='';
    var nav=NAV[S.role];if(!nav){S.authErr='Tu rol no es válido. Avísale a tu supervisora.';render();return;}
    go(nav[0][0]);
  }).catch(function(e){S.ready=true;S.authErr=errMsg(e);render();});
});

/* ====== navegación y suscripciones por vista ====== */
function go(view){
  S.view=view;S.msg=null;loadAcfg();
  Object.keys(S.unsubs).forEach(function(k){S.unsubs[k]();});S.unsubs={};S.data={};
  var uid=S.user.uid;
  if(S.role==='asesor'){
    if(view==='ventas')sub('ventas_mias',db.collection('ventas_asesor').where('asesorUid','==',uid));
    if(view==='casos')sub('casos',db.collection('casos').where('asesorUid','==',uid));
  }
  if(S.role==='tecnico'&&view==='tcasos'){
    sub('casos_todos',db.collection('casos'));
  }
  if(S.role==='admin'){
    if(view==='venta'){sub('ventas_marca',db.collection('ventas_asesor'));sub('directorio',db.collection('directorio'));}
    if(view==='resumen'){sub('ventas_asesor',db.collection('ventas_asesor'));sub('casos',db.collection('casos'));}
    if(view==='repetidas')sub('ventas_asesor',db.collection('ventas_asesor'));
    if(view==='personas')sub('usuarios',db.collection('usuarios'),syncDir);
    if(view==='importar'){sub('usuarios',db.collection('usuarios'));sub('ventas_asesor',db.collection('ventas_asesor'));sub('casos',db.collection('casos'));}
  }
  render();
}

/* ====== render ====== */
function grab(){var m={},a=document.activeElement,els=document.querySelectorAll('#root input[id],#root select[id],#root textarea[id]');
  for(var i=0;i<els.length;i++){var e=els[i];if(e.type==='file')continue;m[e.id]=e.type==='checkbox'?e.checked:e.value;}
  m.__f=a&&a.id?a.id:null;m.__s=a&&a.selectionStart!=null?a.selectionStart:null;return m;}
function restore(m){Object.keys(m).forEach(function(id){if(id==='__f'||id==='__s')return;var e=$(id);if(!e)return;
  if(e.type==='checkbox'){e.checked=m[id];return;}if(m[id]===''||m[id]==null)return;
  if(e.tagName==='SELECT'){for(var i=0;i<e.options.length;i++)if(e.options[i].value===m[id]||e.options[i].text===m[id]){e.value=e.options[i].value;break;}}else e.value=m[id];});
  if(m.__f&&$(m.__f)){var f=$(m.__f);f.focus();if(m.__s!=null){try{f.setSelectionRange(m.__s,m.__s);}catch(x){}}}}
function render(){
  var root=$('root'),keep=grab();
  if(!S.ready){root.innerHTML='<div class="login"><div class="mu">Cargando…</div></div>';return;}
  if(!S.user||!S.role){root.innerHTML=loginHTML();restore(keep);after();return;}
  var nav=NAV[S.role].map(function(n){return '<button class="nv'+(S.view===n[0]?' on':'')+'" onclick="A.go(\''+n[0]+'\')">'+n[1]+'</button>';}).join('');
  var who=S.role==='admin'?'Supervisora':ROLES[S.role];
  root.innerHTML='<div class="app"><aside class="sb"><div class="br"><span class="mk"></span>Panel de Asesores</div>'+nav+
    '<div class="me"><b>'+esc(nombre())+'</b><span class="mu">'+esc(who)+'</span><span class="mu" style="display:block;font-size:11px">'+VERSION+'</span><button class="bt sm" style="margin-top:8px" onclick="A.out()">Salir</button></div></aside><main class="mn">'+
    (S.msg?'<div class="al '+S.msg.c+'">'+esc(S.msg.t)+'</div>':'')+viewHTML()+'</main></div>';
  restore(keep);after();
}
function hhmm(ms){if(!ms)return '';var d=new Date(ms);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function fdt(ms){if(!ms)return '';var d=new Date(ms);return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+' '+hhmm(ms);}
function horasDesde(ms){return ms?Math.floor((Date.now()-ms)/36e5):null;}
function durTxt(h){return h>=24?Math.floor(h/24)+' d '+(h%24)+' h':h+' h';}
/* enlace de WhatsApp con mensaje listo (solo si el teléfono parece válido) */
function waLink(c){
  var t=String(c.telefono||'').replace(/\D/g,'');
  if(t.length===11&&t.charAt(0)==='0')t='58'+t.slice(1);else if(!(t.length===12&&t.indexOf('58')===0))return '';
  var nm=String(c.cliente||'').trim().split(/\s+/)[0]||'',mk=(BRANDS[c.marca]||{n:''}).n;
  var msg='Hola '+nm+', te escribimos de '+mk+' por tu equipo '+(c.equipo||'')+' (caso '+(c.folio||'')+'). ¿Cómo estás?';
  return 'https://wa.me/'+t+'?text='+encodeURIComponent(msg);
}
/* bloque de comprobante de contacto en la pantalla del técnico */
function contactoBlock(c){
  if(c.contactoCaptura)return '<div class="al o">✅ Contactaste al cliente el '+fdt(c.contactoMs)+'.</div><img class="shot" src="'+c.contactoCaptura+'" alt="Comprobante de contacto"><div class="bs"><label class="bt sm" style="display:inline-flex;align-items:center;cursor:pointer">Cambiar comprobante<input type="file" accept="image/*" class="hide" onchange="A.contacto(\''+c.id+'\',this)"></label></div>';
  var wa=waLink(c);
  return '<div class="al w">⚠️ Falta el comprobante: escríbele al cliente y sube la captura de la conversación.</div><div class="bs">'+(wa?'<a class="bt sm" style="display:inline-flex;align-items:center;text-decoration:none" href="'+wa+'" target="_blank" rel="noopener">Abrir WhatsApp</a>':'')+'<label class="prim sm" style="display:inline-flex;align-items:center;cursor:pointer">📸 Subir comprobante de contacto<input type="file" accept="image/*" class="hide" onchange="A.contacto(\''+c.id+'\',this)"></label></div>';
}
/* ====== alertas por días sin atención (los umbrales los define la supervisora en el CRG) ====== */
function loadAcfg(){if(S.cache.acfgLoaded)return;S.cache.acfgLoaded=true;db.doc('store/crg_alertas_garantias').get().then(function(s){var v=s.exists&&s.data().value;if(v){S.cache.acfg=v;softRender();}}).catch(function(){});}
function alertaCfg(){var c=S.cache.acfg||{},a=Number(c.aviso)>0?Number(c.aviso):2,k=Number(c.critico)>0?Number(c.critico):3;if(k<a)k=a;var cl=Number(c.cliente)>0?Number(c.cliente):3;return {activo:c.activo!==false,aviso:a,critico:k,cliente:cl};}
function diaMs(s){var t=s?Date.parse(String(s).slice(0,10)+'T00:00:00'):NaN;return isNaN(t)?0:t;}
function alertasCasos(casos,cfg){
  var out=[],now=Date.now(),D=864e5;if(cfg.activo===false)return out;
  (casos||[]).forEach(function(c){
    if(c.estado==='Resuelto'&&c.fechaEntregado)return;
    var tm=(c.actualizadoAt&&c.actualizadoAt.toMillis)?c.actualizadoAt.toMillis():0,creado=c.creadoMs||diaMs(c.fechaRecibido)||0;
    var asig=c.fechaAsignacion?Date.parse(c.fechaAsignacion):0;if(isNaN(asig))asig=0;
    var last=Math.max(creado,asig,c.tomadoMs||0,c.contactoMs||0,c.listoMs||0,tm),m=[];
    function add(k,t,ref){if(!ref)return;var d=Math.floor((now-ref)/D);if(d>=cfg.aviso)m.push({k:k,t:t,d:d});}
    if(c.estado!=='Resuelto'){
      if(c.esperaClienteMs>0){
        /* El técnico ya escribió y el cliente quedó en responder: el reloj del técnico se pausa y solo se avisa la demora del cliente. */
        var dc=Math.floor((now-c.esperaClienteMs)/D);
        if(dc>=cfg.cliente)out.push({c:c,m:[{k:'cliente',t:'El cliente no ha respondido'+(c.esperaClienteNota?' ('+c.esperaClienteNota+')':''),d:dc}],d:dc,nivel:'cliente',tipo:'cliente'});
        return;
      }
      if(!c.tecnicoUid)add('sin_tecnico','Nadie ha tomado el caso',creado);
      else if(!c.contactoCaptura)add('sin_contacto','Pasó el plazo de '+cfg.aviso+' días sin comprobante de contacto con el cliente',c.tomadoMs||asig||creado);
      add('sin_mov','Pasó el plazo de '+cfg.aviso+' días sin actualizar el caso',last);
    }else{
      var rs=diaMs(c.fechaResuelto)||last;
      if(!(c.listoCapturas&&c.listoCapturas.length))add('sin_aviso','Equipo listo sin comprobante de aviso al cliente',rs);
      add('sin_entrega','Equipo listo sin entregar',rs);
    }
    if(m.length){var mx=Math.max.apply(null,m.map(function(x){return x.d;}));out.push({c:c,m:m,d:mx,nivel:mx>=cfg.critico?'critico':'aviso'});}
  });
  var rk={critico:0,aviso:1,cliente:2};
  out.sort(function(a,b){return (rk[a.nivel]-rk[b.nivel])||b.d-a.d;});
  return out;
}
function alPill(c){var x=alertasCasos([c],alertaCfg())[0];if(!x)return (c.esperaClienteMs>0&&c.estado!=='Resuelto')?'<span class="pill p-b" title="El reloj del técnico está en pausa">⏸️ Esperando al cliente</span>':'';if(x.tipo==='cliente')return '<span class="pill p-b" title="'+esc(x.m.map(function(y){return y.t;}).join(' · '))+'">⏸️ Cliente sin responder · '+x.d+' d</span>';return x?'<span class="pill '+(x.nivel==='critico'?'p-r':'p-w')+'" title="'+esc(x.m.map(function(y){return y.t;}).join(' · '))+'">⏰ '+x.d+' d</span>':'';}
function alertasHTML(AL){
  var cfg=alertaCfg();
  var rows=AL.slice(0,40).map(function(x){var c=x.c;return '<div class="item" style="border-left-color:'+(x.nivel==='critico'?'var(--bad)':x.nivel==='cliente'?'#5CA4FF':'var(--amb)')+'"><div class="hd"><span class="pill '+(x.nivel==='critico'?'p-r':x.nivel==='cliente'?'p-b':'p-w')+'">'+(x.nivel==='critico'?'Crítico':x.nivel==='cliente'?'Cliente sin responder':'Aviso')+' · '+x.d+' d</span>'+brandPill(c.marca)+'<b>'+esc(c.cliente)+'</b><span class="rt mu">'+esc(c.tecnico||'Sin técnico')+' · '+esc(c.folio||'')+'</span></div><div class="ln">'+x.m.map(function(y){return '• '+esc(y.t)+' ('+y.d+' d)';}).join('<br>')+'</div></div>';}).join('')||'<div class="mu">Todo al día: ningún caso supera '+cfg.aviso+' días sin atención.</div>';
  return '<div class="cd"><div class="sec">Alertas de seguimiento</div><div class="mu">Aviso desde '+cfg.aviso+' días y crítico desde '+cfg.critico+' días (se ajusta en el panel CRG, con la campana 🔔). Si un cliente queda en responder, el caso pasa a "Esperando al cliente" y solo avisa a los '+cfg.cliente+' días.</div>'+rows+'</div>';
}

function listoBlock(c){

  var imgs=L.map(function(x){return '<img class="shot" src="'+x.u+'" alt="Comprobante de aviso">';}).join('');

  return (L.length?'<div class="al o">✅ Avisaste que el equipo está listo ('+L.length+' captura'+(L.length>1?'s':'')+').</div>'+imgs:'<div class="al w">⚠️ Equipo resuelto: avísale al cliente que ya puede retirarlo y sube la captura (o su respuesta).</div>')+'<div class="bs">'+up+'</div>';

/* ====== ASESOR: registrar venta ====== */
var F={brand:null,nota:'',suc:'',rd:null,saving:false};
function misMarcas(){return marcas().filter(function(b){return BRANDS[b];});}
function ventasAll(){var m={};(S.data.ventas_mias||[]).concat(S.data.ventas_marca||[]).forEach(function(v){m[v.id]=v;});return Object.keys(m).map(function(k){return m[k];});}
function asesoresDir(){return (S.data.directorio||[]).filter(function(d){return d.rol==='asesor'&&d.activo!==false;}).sort(function(x,y){return (x.nombre||'').localeCompare(y.nombre||'');});}
/* busca a quien vendió en la lista de asesores; tolera mayúsculas, acentos y nombres incompletos */
function matchAsesor(name){
  var res={uno:null,varios:[]},t=norm(name).split(/\s+/).filter(Boolean);
  if(!t.length)return res;
  var all=asesoresDir();
  var ex=all.filter(function(d){return norm(d.nombre).split(/\s+/).filter(Boolean).join(' ')===t.join(' ');});
  if(ex.length===1){res.uno=ex[0];return res;}
  var c=all.filter(function(d){var w=norm(d.nombre).split(/\s+/);return t.every(function(x){return w.indexOf(x)>=0;});});
  if(c.length===1)res.uno=c[0];else res.varios=c;
  return res;
}
function mapCanal(raw){var n=norm(raw);if(!n)return '';
  if(n.indexOf('whats')>=0||n==='wa'||n==='ws')return 'WhatsApp';if(n.indexOf('insta')>=0)return 'Instagram';if(n.indexOf('face')>=0)return 'Facebook';
  if(n.indexOf('tienda')>=0||n.indexOf('fisic')>=0||n.indexOf('local')>=0)return 'Tienda';if(n.indexOf('referid')>=0)return 'Referido';if(n.indexOf('lead')>=0)return 'Leads';return 'Otro';}
function pnum(s){s=String(s||'').replace(/[^\d.,]/g,'');if(!s)return '';
  var c=s.lastIndexOf(','),d=s.lastIndexOf('.');
  if(c>=0&&d>=0){s=c>d?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');}
  else if(c>=0){s=/,\d{1,2}$/.test(s)?s.replace(',','.'):s.replace(/,/g,'');}
  else if(d>=0&&s.split('.').length>2){s=s.replace(/\./g,'');}
  var n=Number(s);return isNaN(n)||n<=0?'':String(n);}
/* en los reportes, "free" significa Central */
var SEDE_ALIAS={free:'Central'};
function sedeInfo(raw){
  var n=norm(raw),marca='';
  if(/tekio|tequio/.test(n))marca='tekio';else if(/infot|info\s*t|\binfo\b/.test(n))marca='infot';else if(/mega/.test(n))marca='megalaptop';
  var rest=n.replace(/tekio|tequio|infot|info\s*t|\binfo\b|mega\s*-?\s*laptop|\bmega\b|\blaptop\b/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  return {marca:marca,want:SEDE_ALIAS[rest]||rest};
}
/* lee el reporte que pegan los asesores y saca solo lo que el panel necesita */
function parseVenta(txt){
  var out={fecha:'',nota:'',sedeRaw:'',marca:'',sucWant:'',producto:'',precio:'',canalRaw:'',vendedor:''};
  var lines=String(txt||'').split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean);
  var prod=[],afterSede=false,prodDone=false,promo='',normal='';
  lines.forEach(function(l){
    var m;
    if(!out.fecha&&(m=l.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))){var y=m[3].length===2?'20'+m[3]:m[3];out.fecha=y+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);return;}
    if(!out.nota&&(m=l.match(/^nota(?:\s*fina)?\s*(?:n[°º]\s*)?[#:\-]?\s*(\d+)/i))){out.nota=m[1];return;}
    if(!out.sedeRaw&&(m=l.match(/^(?:sede|sucursal|tienda)\s*:\s*(.+)/i))){out.sedeRaw=m[1];afterSede=true;return;}
    if(!out.vendedor&&(m=l.match(/^(?:asesor|asesora|vendedor|vendedora)\s*:\s*(.+)/i))){out.vendedor=m[1].trim();return;}
    if(!out.canalRaw&&(m=l.match(/^canal(?:\s+de\s+venta)?\s*:\s*(.+)/i))){out.canalRaw=m[1].trim();return;}
    if(!promo&&(m=l.match(/^precio\s*promo[^:\d]*[:\s]*\$?\s*([\d.,]+)/i))){promo=pnum(m[1]);prodDone=true;return;}
    if(!normal&&(m=l.match(/^precio(?!\s*regular)[^:\d]*[:\s]*\$?\s*([\d.,]+)/i))){normal=pnum(m[1]);prodDone=true;return;}
    if(/^(s\/?n\b|serial|precio|m[eé]todo|inicial|entrega|origen|ref\b|canal|asesor)/i.test(l)){if(afterSede)prodDone=true;return;}
    if(afterSede&&!prodDone)prod.push(l);
  });
  out.precio=promo||normal;
  out.producto=prod.join(' + ');
  var si=sedeInfo(out.sedeRaw);out.marca=si.marca;out.sucWant=si.want;
  return out;
}

  '<div class="ft"><div class="tt"><small>Total de la venta</small><b id="v-total">$0.00</b></div><button class="prim" id="v-save" onclick="A.saveVenta()"'+(F.saving?' disabled':'')+'>'+(F.saving?'Guardando…':'Guardar venta')+'</button></div></div>';
}
function dupNota(){var n=String(F.nota||'').trim();if(!n)return false;return ventasAll().some(function(v){return String(v.notaFina)===n&&v.marca===F.brand;});}
function mesAnt(){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);}

function vMisVentas(){
  var uid=S.user.uid,mm=misMarcas(),fs=S.fs||'mias',fp=S.fp||'mes',fv=S.fv||'Todas';
  var all=ventasAll().sort(function(a,b){return (b.fecha||'').localeCompare(a.fecha||'')||String(b.notaFina).localeCompare(String(a.notaFina));});
  function esMia(v){return v.asesorUid===uid;}
  function deMarca(v){return mm.indexOf(v.marca)>=0;}
  var mes=hoy().slice(0,7),ant=mesAnt();
  var base=all.filter(function(v){var m=(v.fecha||'').slice(0,7);
    var okP=fp==='todo'||(fp==='mes'&&m===mes)||(fp==='ant'&&m===ant);
    var okS=fs==='mias'?esMia(v):(fs==='tienda'?deMarca(v):(esMia(v)||deMarca(v)));
    return okP&&okS;});
  var lista=base.filter(function(v){return fv==='Todas'||v.marca===fv;});
  function suma(l){return l.reduce(function(a,v){return a+(v.total||0);},0);}
  var cards='<div class="sc" style="--t:var(--vio)"><small>Total</small><b>'+lista.length+'</b><span class="mu">'+money(suma(lista))+' vendidos</span></div>'+
    Object.keys(BRANDS).map(function(b){var l=base.filter(function(v){return v.marca===b;});return '<div class="sc" style="--t:'+BRANDS[b].color+'"><small>'+BRANDS[b].n+'</small><b>'+l.length+'</b><span class="mu">'+money(suma(l))+' vendidos</span></div>';}).join('');
  var rows=lista.map(function(v){

    '<span style="flex:1 1 160px;font-weight:600">'+esc(v.producto)+(v.cantidad>1?' <span class="mu" style="font-weight:400">× '+esc(v.cantidad)+'</span>':'')+(v.sucursal?' <span class="mu" style="font-weight:400">· '+esc(v.sucursal)+'</span>':'')+'</span>'+
    (esMia(v)?'<span class="pill p-v">Tuya</span>':'<span class="mu" style="flex:0 0 140px">Vendió '+esc(v.asesor||'—')+'</span>')+
    '<span class="mu" style="flex:0 0 90px">'+esc(v.canal)+'</span>'+(v.porRevisar?'<span class="pill p-w">Por revisar</span>':'')+'<b style="flex:0 0 90px;text-align:right;color:var(--ok)">'+money(v.total)+'</b></div>';}).join('')||'<div class="mu" style="padding:12px 0">No hay ventas con estos filtros.</div>';
  function chips(lst,cur,fn){return lst.map(function(x){return '<button class="cp'+(cur===x[0]?' on':'')+'" onclick="A.'+fn+'(\''+x[0]+'\')">'+x[1]+'</button>';}).join('');}
  var c1=chips([['todo','Todo lo mío'],['tienda','Ventas de mi marca'],['mias','Solo mis ventas']],fs,'fs');
  var c2=chips([['mes','Este mes'],['ant','Mes anterior'],['todo','Todo']],fp,'fp');
  var c3=chips([['Todas','Todas las marcas']].concat(Object.keys(BRANDS).map(function(b){return [b,BRANDS[b].n];})),fv,'fv');
  return '<div><h1>Mis ventas</h1><div class="mu" style="padding-top:4px">Las ventas que tu supervisora registró a tu nombre. Úsalas para revisar tu comisión; si ves algún error, avísale.</div></div>'+
  '<div class="stats">'+cards+'</div><div class="cd"><div class="fl">'+c2+'</div><div class="fl">'+c3+'</div><div>'+rows+'</div></div>';
}
function gruposRep(){
  var g={};(S.data.ventas_asesor||[]).forEach(function(v){var k=[v.marca,String(v.notaFina).trim(),Number(v.total)||0].join('|');(g[k]=g[k]||[]).push(v);});
  return Object.keys(g).filter(function(k){return g[k].length>1;}).map(function(k){
    var l=g[k].slice().sort(function(a,b){var ia=(a.estado&&a.estado!=='nueva')?0:1,ib=(b.estado&&b.estado!=='nueva')?0:1;return ia-ib||(a.creadoMs||0)-(b.creadoMs||0);});
    return {k:k,keep:l[0],extra:l.slice(1)};});
}
function vRepetidas(){
  var gs=gruposRep();
  var rows=gs.map(function(g){var v=g.keep,proc=g.extra.some(function(x){return x.estado&&x.estado!=='nueva';});
    return '<div class="item"><div class="hd">'+brandPill(v.marca)+'<b>Nota '+esc(v.notaFina)+'</b><span class="mu">'+esc(v.producto)+' · '+money(v.total)+' · vendió '+esc(v.asesor||'—')+' · '+fdate(v.fecha)+'</span><span class="rt"><span class="pill p-w">'+(g.extra.length+1)+' copias</span></span></div>'+
    (proc?'<div class="al w">Alguna copia ya fue procesada por el CRG. Si el CRG ya la importó, bórrala también allá.</div>':'')+
    '<div class="bs"><button class="prim sm" onclick="A.limpiarRep(\''+esc(g.k)+'\')">Borrar '+g.extra.length+' copia'+(g.extra.length>1?'s':'')+' y dejar 1</button></div></div>';}).join('')||'<div class="al o">No hay ventas repetidas.</div>';
  return '<div><h1>Ventas repetidas</h1><div class="mu" style="padding-top:4px">Ventas con la misma marca, nota y monto. Se conserva la que ya procesó el CRG o, si no, la más antigua.</div></div>'+rows;
}
A.limpiarRep=function(k){

var WA=(function(){
const BRANDS=['TEKIO','INFOT','MEGA LAPTOP'];
const BRAND_LABEL={TEKIO:'Tekio',INFOT:'Infot','MEGA LAPTOP':'Mega Laptop'};
const PARSE_PATTERNS = [
  ['fecha', [/^fecha\s*(?:de\s*recepci[oó]n)?\s*:\s*(.+)/i, /^d[ií]a\s*:\s*(.+)/i]],
  ['sucursalRaw', [/^sucursal\s*:\s*(.+)/i, /^tienda\s*:\s*(.+)/i, /^local\s*:\s*(.+)/i, /^punto\s*:\s*(.+)/i]],
  ['cliente', [/^nombre\s*y\s*apellido\s*(?:\([^)]*\))?\s*:?\s*(.+)/i, /^nombre\s+del\s+cliente\s*:\s*(.+)/i, /^cliente\s*:\s*(.+)/i, /^nombre\s*:\s*(.+)/i]],
  ['telefono', [/^(?:n[uú]mero de )?tel[eé]fono\s*(?:\([^)]*\))?\s*:\s*(.+)/i, /^(?:whats\s*app|whatsapp)\s*(?:\([^)]*\))?\s*:\s*(.+)/i, /^cel(?:ular)?\s*(?:\([^)]*\))?\s*:\s*(.+)/i, /^contacto\s*(?:\([^)]*\))?\s*:\s*(.+)/i, /^n[uú]mero\s*(?:\([^)]*\))?\s*:\s*(.+)/i],],
  ['marcaEquipo', [/^marca\s*del\s*equipo\s*:\s*(.+)/i]],
  ['modeloEquipo', [/^modelo\s*:\s*(.+)/i]],
  ['equipo', [/^marca\s*y\s*modelo\s*del\s*equipo\s*:\s*(.+)/i, /^equipo\s*:\s*(.+)/i, /^dispositivo\s*:\s*(.+)/i, /^laptop\s*:\s*(.+)/i]],
  ['serial', [/^serial\s*:\s*(.+)/i, /^n[uú]mero\s+de\s+serie\s*:\s*(.+)/i, /^imei\s*:\s*(.+)/i, /^s\/n\s*:\s*(.+)/i]],
  ['falla', [/^falla\s*(?:presentada|reportada)?\s*:\s*(.+)/i, /^problema\s*:\s*(.+)/i, /^aver[ií]a\s*:\s*(.+)/i, /^da[ñn]o\s*:\s*(.+)/i, /^motivo\s*:\s*(.+)/i]],
  ['asesorNombre', [/^recibido\s*por\s*:\s*(.+)/i, /^asesor(?:\s+responsable)?\s*:\s*(.+)/i, /^atendido\s*por\s*:\s*(.+)/i, /^registrad[oa]\s*por\s*:\s*(.+)/i]],
  ['entregan', [/^entregan\s*:\s*(.+)/i, /^entrega\s*:\s*(.+)/i, /^accesorios\s*:\s*(.+)/i]],
];
function stripEmojiAndBold(s){
  // quita emojis/símbolos decorativos al inicio (📅 📍 👤 📱 🏷️ 🔢 ❌ etc.) y asteriscos de negrita
  return String(s||'').replace(/^[^\wÀ-ÿ]+/, '').replace(/\*/g,'').trim();
}
function mergeOrphanLabels(lines){
  // Cuando alguien escribe "Recibido por:" y pone el nombre en la línea de abajo
  // (muy común al pegar desde WhatsApp), une esa etiqueta con el valor de la
  // siguiente línea — pero solo si esa línea siguiente no es, a su vez, otra
  // etiqueta (no contiene ":"), para no mezclar dos campos distintos.
  const out = [];
  for(let i=0;i<lines.length;i++){
    const line = lines[i];
    const next = lines[i+1];
    if(/:\s*$/.test(line) && next && next.indexOf(':')===-1){
      out.push(line.replace(/:\s*$/,'') + ': ' + next);
      i++; // la línea siguiente ya quedó incorporada, no procesarla aparte
    } else {
      out.push(line);
    }
  }
  return out;
}
function parseWhatsappReport(text){
  const rawLines = String(text||'').split('\n').map(l=>stripEmojiAndBold(l)).filter(Boolean);
  const lines = mergeOrphanLabels(rawLines);
  const out = {};
  for(const line of lines){
    for(const [key, patterns] of PARSE_PATTERNS){
      if(out[key]) continue;
      for(const re of patterns){
        const m = line.match(re);
        if(m){ out[key] = m[1].trim().replace(/\*/g,''); break; }
      }
    }
  }
  // "Marca del equipo" y "Modelo" a veces vienen en líneas separadas (ej. "Dell" / "Latitude 5410") —
  // si no hubo una línea de "Equipo:" completa, se unen en un solo campo.
  if(!out.equipo){
    const partes = [out.marcaEquipo, out.modeloEquipo].filter(Boolean);
    if(partes.length) out.equipo = partes.join(' ');
  }
  delete out.marcaEquipo; delete out.modeloEquipo;
  // fecha dd/mm/yy(yy) -> ISO
  if(out.fecha){
    const m = out.fecha.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if(m){
      let [_,dd,mm,yy] = m;
      if(yy.length===2) yy = (parseInt(yy,10) > 70 ? '19' : '20') + yy;
      out.fechaISO = yy+'-'+mm.padStart(2,'0')+'-'+dd.padStart(2,'0');
    }
  }
  // adivinar marca a partir de sucursalRaw — tolerante a acentos, espacios y variaciones
  // ("Megalaptop", "Mega Laptop", "MEGA-LAPTOP" deben reconocerse igual).
  if(out.sucursalRaw){
    const raw = out.sucursalRaw.trim();
    out.sucursalGuess = raw; // se conserva siempre, para intentar preseleccionar la sucursal exacta después
    const norm = raw.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z]/g,'');
    let brandHit = BRANDS.find(b=>b===raw.toUpperCase() || BRAND_LABEL[b].toUpperCase()===raw.toUpperCase());
    if(!brandHit){
      if(norm.indexOf('TEKIO')!==-1) brandHit = 'TEKIO';
      else if(norm.indexOf('INFOT')!==-1) brandHit = 'INFOT';
      else if(norm.indexOf('MEGALAPTOP')!==-1 || norm.indexOf('MEGA')!==-1) brandHit = 'MEGA LAPTOP';
    }
    if(brandHit){ out.marcaGuess = brandHit; }
  }
  // adivinar el tipo de registro a partir del encabezado del mensaje
  // ("RECEPCIÓN DE GARANTÍA" vs "RECEPCIÓN DE SERVICIO TÉCNICO")
  const headerText = rawLines.slice(0,3).join(' ').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(/SERVICIO\s*TECNICO/.test(headerText)) out.tipoGuess = 'Servicio Técnico';
  else if(/GARANT/.test(headerText)) out.tipoGuess = 'Garantía';
  return out;
}
return {parse:parseWhatsappReport};
})();

  else{var t=String(v).trim(),m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);

    m=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);

A.limpiarCaso=function(){var t=C.tipo;C={tipo:t,nota:'',found:null,msg:'',suc:'',sucGuess:'',det:null,recibido:''};['c-paste','c-cli','c-tel','c-eq','c-ser','c-ent','c-falla','c-nota'].forEach(function(id){var e=$(id);if(e)e.value='';});var mm=$('c-marca');if(mm)mm.value='';var ff=$('c-fecha');if(ff)ff.value=hoy();render();};
A.detectCaso=function(){
  var ta=$('c-paste'),txt=ta?ta.value:'';
  if(!txt.trim()){toast('Pega primero el reporte de WhatsApp.');return;}
  var p=WA.parse(txt),warn=[],miss=[];
  function set(id,v){var e=$(id);if(e&&v)e.value=v;}
  set('c-fecha',p.fechaISO);set('c-cli',p.cliente);set('c-tel',p.telefono);set('c-eq',p.equipo);set('c-ser',p.serial);set('c-falla',p.falla);set('c-ent',p.entregan);
  if(p.tipoGuess)C.tipo=p.tipoGuess==='Servicio Técnico'?'Servicio técnico':'Garantía';
  C.recibido=p.asesorNombre||'';
  [['cliente','Cliente'],['telefono','Teléfono'],['equipo','Equipo'],['serial','Serial'],['falla','Falla']].forEach(function(x){if(!p[x[0]])miss.push(x[1]);});
  var n=['fechaISO','cliente','telefono','equipo','serial','falla','entregan','sucursalRaw'].filter(function(k){return p[k];}).length;
  var dig=(p.telefono||'').replace(/\D/g,'');
  if(p.telefono&&dig.length!==11)warn.push('Revisa el teléfono: tiene '+dig.length+' dígitos.');
  if(p.asesorNombre&&S.role==='asesor'){var a1=nl(p.asesorNombre),a2=nl(nombre());if(a1&&a2&&a2.indexOf(a1)<0&&a1.indexOf(a2)<0)warn.push('El reporte dice «Recibido por: '+p.asesorNombre+'», pero el caso se guarda a nombre de '+nombre()+'.');}
  if(p.serial){var prev=(S.data.casos||[]).filter(function(c){return String(c.serial||'').trim().toLowerCase()===p.serial.trim().toLowerCase();})[0];if(prev)warn.push('Ojo: este serial ya tiene un caso registrado ('+prev.folio+'). Se marcará como reincidencia.');}
  var raw=p.sucursalRaw||'';C.suc='';C.sucGuess=raw;
  function fin(){C.det={n:n,miss:miss,warn:warn};render();}
  function setMarca(k){var mm=$('c-marca');if(mm)mm.value=k;}
  if(p.marcaGuess){
    var k=BKEY[p.marcaGuess];setMarca(k);
    sucursales(k).then(function(l){if(raw&&!pickSuc(l,raw))warn.push('No pude emparejar la sucursal «'+raw+'»: elígela en la lista.');fin();});
  }else if(raw){
    Promise.all(Object.keys(BRANDS).map(function(b){return sucursales(b).then(function(l){return {b:b,l:l};});})).then(function(rs){
      var hit=rs.filter(function(r){return pickSuc(r.l,raw);})[0];
      if(hit)setMarca(hit.b);else warn.push('No reconocí la marca ni la sucursal «'+raw+'»: elígelas en la lista.');
      fin();});
  }else{miss.push('Sucursal');fin();}
};
A.notaCaso=function(v){
  C.nota=v;var n=v.trim();if(!n){C.found=null;C.msg='';return;}
  clearTimeout(A._t);A._t=setTimeout(function(){
    var own=(S.data.ventas_asesor||[]);
    var hit=null;
    Promise.all(Object.keys(BRANDS).map(function(b){return ventasCRG(b).then(function(l){return {b:b,l:l};});})).then(function(rs){
      var h=null;
      rs.forEach(function(r){(r.l||[]).forEach(function(x){if(!h&&String(x.notaFina)===n)h={marca:r.b,sucursal:x.sucursal,producto:x.producto,asesor:x.asesor};});});
      return h;
    }).then(function(h){
      if(!$('c-nota')||$('c-nota').value.trim()!==n)return;
      C.found=h;C.msg=h?'Venta encontrada: '+h.producto+' ('+(BRANDS[h.marca]?BRANDS[h.marca].n:h.marca)+'). Se completaron marca, sucursal y equipo.':'No encontramos esa nota fina. Puedes llenar los datos a mano.';
      render();
      var ms=$('c-marca');if(h&&ms){ms.value=h.marca;A.fillSucCaso();}
    });
  },450);
};
A.saveCaso=function(){
  var cli=$('c-cli').value.trim(),eq=$('c-eq').value.trim(),falla=$('c-falla').value.trim(),marca=$('c-marca').value,sel=$('c-suc'),suc=sel?sel.value:'';
  if(!cli||!eq||!falla){S.msg={c:'w',t:'Completa cliente, equipo y falla.'};render();return;}
  if(!marca){S.msg={c:'w',t:'Elige la marca.'};render();return;}
  if(sel&&sel.options.length>1&&!suc){S.msg={c:'w',t:'Elige la sucursal.'};render();return;}
  var fe=$('c-fecha').value||hoy(),yy=fe.slice(2).replace(/-/g,'');
  var rnd=Math.random().toString(36).slice(2,6).toUpperCase(),ser=$('c-ser').value.trim();
  var prev=ser?(S.data.casos||[]).filter(function(c){return String(c.serial||'').trim().toLowerCase()===ser.toLowerCase();})[0]:null;
  var doc={folio:(C.tipo==='Garantía'?'GT-':'ST-')+yy+'-'+rnd,tipo:C.tipo,notaFina:$('c-nota').value.trim(),cliente:cli,telefono:$('c-tel').value.trim(),serial:ser,equipo:eq,falla:falla,entregan:$('c-ent').value.trim(),recibidoPor:C.recibido||'',reincidenciaDe:prev?prev.folio:'',marca:marca,sucursal:suc,asesor:nombre(),asesorUid:S.user.uid,tecnico:'',tecnicoUid:null,estado:'Pendiente',fechaRecibido:fe,fechaResuelto:'',fechaEntregado:'',observaciones:'',creadoAt:ts(),creadoMs:Date.now()};
  db.collection('casos').add(doc).then(function(){S.showCaso=false;S.msg={c:'o',t:'Caso guardado. El técnico lo verá en su Mesa de garantías.'};render();}).catch(function(e){S.msg={c:'e',t:errMsg(e)};render();});
};
/* comprimir imágenes (comprobantes) */
function compress(file){return new Promise(function(res,rej){var r=new FileReader();r.onerror=rej;r.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){var max=900,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.6));};im.src=r.result;};r.readAsDataURL(file);});}
/* técnico */
A.listo=function(id,inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var c=(S.data.casos_todos||[]).filter(function(x){return x.id===id;})[0]||{},L=(c.listoCapturas||[]).slice();
  if(L.length>=3){toast('Ya subiste 3 capturas en este caso.');return;}
  toast('Subiendo comprobante…');
  compress(f).then(function(url){
    var tot=url.length+(c.contactoCaptura||'').length+L.reduce(function(s,x){return s+x.u.length;},0);
    if(tot>900000)throw new Error('Las capturas ya ocupan el máximo permitido por caso.');
    var ms=Date.now();L.push({u:url,ms:ms});
    return db.doc('casos/'+id).update({listoCapturas:L,listoMs:c.listoMs||ms,listoPor:nombre(),actualizadoAt:ts()});
  }).then(function(){toast('Comprobante guardado. Quedó registrado el aviso al cliente.');})
   .catch(function(e){S.msg={c:'e',t:'No se pudo guardar el comprobante: '+errMsg(e)};render();});
};
A.contacto=function(id,inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  toast('Subiendo comprobante…');
  compress(f).then(function(url){return db.doc('casos/'+id).update({contactoCaptura:url,contactoAt:ts(),contactoMs:Date.now(),contactoPor:nombre(),actualizadoAt:ts()});})
   .then(function(){toast('Comprobante guardado. Quedó registrado que contactaste al cliente.');})
   .catch(function(e){S.msg={c:'e',t:'No se pudo guardar el comprobante: '+errMsg(e)};render();});
};
A.ftec=function(f){S.ft=f;render();};
A.tomar=function(id){db.doc('casos/'+id).update({tecnicoUid:S.user.uid,tecnico:nombre(),tomadoMs:Date.now(),actualizadoAt:ts()}).catch(function(e){S.msg={c:'e',t:errMsg(e)};render();});};
A.estado=function(id,e){var u={estado:e,actualizadoAt:ts()};u.fechaResuelto=e==='Resuelto'?hoy():'';if(e==='Resuelto'){u.esperaClienteMs=0;u.esperaClienteNota='';}db.doc('casos/'+id).update(u).catch(function(x){S.msg={c:'e',t:errMsg(x)};render();});};
A.entregar=function(id){db.doc('casos/'+id).update({fechaEntregado:hoy(),actualizadoAt:ts()}).catch(function(x){S.msg={c:'e',t:errMsg(x)};render();});};
A.obs=function(id){var all=(S.data.casos_todos||[]);var c=all.filter(function(x){return x.id===id;})[0];var t=window.prompt('Observación del caso:',(c&&c.observaciones)||'');if(t===null)return;db.doc('casos/'+id).update({observaciones:t.trim(),actualizadoAt:ts()}).catch(function(x){S.msg={c:'e',t:errMsg(x)};render();});};
/* El cliente quedó en responder: se pausa el reloj del técnico (no es demora suya) y se avisa si el cliente tarda. */
A.espera=function(id){
  var c=(S.data.casos_todos||[]).filter(function(x){return x.id===id;})[0]||{};
  if(c.esperaClienteMs>0){
    db.doc('casos/'+id).update({esperaClienteMs:0,esperaClienteNota:'',clienteRespondioMs:Date.now(),actualizadoAt:ts()})
      .then(function(){toast('Listo: el caso vuelve a contar tu seguimiento.');})
      .catch(function(x){S.msg={c:'e',t:errMsg(x)};render();});
    return;
  }
  if(!c.contactoCaptura){toast('Primero sube el comprobante de que le escribiste al cliente.');return;}
  var t=window.prompt('Esperando al cliente. ¿Qué quedó pendiente? (ej. "va a decidir si repara")','');if(t===null)return;
  db.doc('casos/'+id).update({esperaClienteMs:Date.now(),esperaClienteNota:t.trim(),esperaClientePor:nombre(),actualizadoAt:ts()})
    .then(function(){toast('Caso en espera del cliente. No cuenta como demora tuya.');})
    .catch(function(x){S.msg={c:'e',t:errMsg(x)};render();});
};
/* supervisora: personas */
A.crear=function(){
  var nom=$('n-nom').value.trim(),mail=$('n-mail').value.trim(),pass=$('n-pass').value,rol=$('n-rol').value;
  var ms=Object.keys(BRANDS).filter(function(b){return $('n-m-'+b).checked;});
  if(!nom||!mail||pass.length<6){S.msg={c:'w',t:'Escribe nombre, correo y una clave de al menos 6 caracteres.'};render();return;}
  var sec;try{sec=firebase.app('sec');}catch(e){sec=firebase.initializeApp(FB_CONFIG,'sec');}
  sec.auth().createUserWithEmailAndPassword(mail,pass).then(function(cred){
    var uid=cred.user.uid;
    return db.doc('usuarios/'+uid).set({nombre:nom,email:mail.toLowerCase(),rol:rol,marcas:ms,activo:true,creadoAt:ts()}).then(function(){return db.doc('directorio/'+uid).set({nombre:nom,rol:rol,activo:true});}).then(function(){return sec.auth().signOut();}).then(function(){S.msg={c:'o',t:'Acceso creado para '+nom+'. Pásale su correo y la clave temporal.'};render();});
  }).catch(function(e){S.msg={c:'e',t:errMsg(e)};render();});
};
A.toggleMarca=function(uid,b){var u=(S.data.usuarios||[]).filter(function(x){return x.id===uid;})[0];if(!u)return;var m=(u.marcas||[]).slice(),i=m.indexOf(b);if(i>=0)m.splice(i,1);else m.push(b);db.doc('usuarios/'+uid).update({marcas:m}).catch(function(e){S.msg={c:'e',t:errMsg(e)};render();});};
A.setRol=function(uid,r){db.doc('usuarios/'+uid).update({rol:r}).then(function(){return db.doc('directorio/'+uid).set({rol:r},{merge:true});}).catch(function(e){S.msg={c:'e',t:errMsg(e)};render();});};
A.toggleActivo=function(uid,v){db.doc('usuarios/'+uid).update({activo:v}).then(function(){return db.doc('directorio/'+uid).set({activo:v},{merge:true});}).catch(function(e){S.msg={c:'e',t:errMsg(e)};render();});};
})();
